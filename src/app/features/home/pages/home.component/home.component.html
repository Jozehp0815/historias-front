<div class="d-flex">
  <app-sidebar></app-sidebar>

  <main class="flex-fill bg-light min-vh-100 p-4">
    <div class="container-fluid">

      <!-- Welcome -->
      <div class="mb-4">
        <h1 class="h3 mb-1 text-gray-800">Bienvenido al Sistema de Historias Clínicas</h1>
        <p class="text-muted mb-0">Panel de control — Resumen general del sistema</p>
      </div>

      <!-- Cards -->
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card border-0 shadow-sm rounded-3 bg-primary text-white">
            <div class="card-body text-center py-4">
              <i class="bi bi-file-medical fs-1"></i>
              <h2 class="mt-2 mb-0">{{ home?.totalHistoriasClinicas ?? '—' }}</h2>
              <p class="mb-0 opacity-75">Total Historias Clínicas</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card border-0 shadow-sm rounded-3 bg-success text-white">
            <div class="card-body text-center py-4">
              <i class="bi bi-calendar-check fs-1"></i>
              <h2 class="mt-2 mb-0">{{ home?.totalHistoriasClinicasCreadasHoy ?? '—' }}</h2>
              <p class="mb-0 opacity-75">Creadas Hoy</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card border-0 shadow-sm rounded-3 bg-warning text-white">
            <div class="card-body text-center py-4">
              <i class="bi bi-calendar-month fs-1"></i>
              <h2 class="mt-2 mb-0">{{ home?.totalHistoriasClinicasCreadasMes ?? '—' }}</h2>
              <p class="mb-0 opacity-75">Creadas este Mes</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
